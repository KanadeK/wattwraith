name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Export locked runtime dependencies
        shell: bash
        run: |
          uv export \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/wattwraith-audit.txt"

      - name: Audit locked runtime dependencies
        shell: bash
        run: |
          uv run pip-audit \
            --requirement "$RUNNER_TEMP/wattwraith-audit.txt" \
            --strict \
            --disable-pip \
            --progress-spinner off

      - name: Scan tracked files for high-confidence secrets
        shell: bash
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          patterns = {
              "AWS access key": re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b"),
              "GitHub token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              "GitHub fine-grained token": re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              "Private key": re.compile(
                  r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "Slack token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
              "Assigned secret": re.compile(
                  r"""(?i)\b(?:api[_-]?key|password|secret|token)\s*[:=]\s*["'][^"']{12,}["']"""
              ),
          }

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          findings: list[tuple[str, int, str]] = []

          for filename in filter(None, tracked):
              path = Path(filename)
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              text = data.decode("utf-8", errors="ignore")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append((filename, line_number, label))

          for filename, line_number, label in findings:
              print(
                  f"::error file={filename},line={line_number}"
                  f"::Potential {label} detected in a tracked file"
              )

          if findings:
              raise SystemExit(f"Secret scan found {len(findings)} potential secret(s)")

          print(f"Secret scan passed for {len([name for name in tracked if name])} tracked files")
          PY
