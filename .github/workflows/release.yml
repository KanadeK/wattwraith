name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified release identity
        shell: bash
        run: |
          git config --local user.name "KanadeK"
          git config --local user.email "121669563+KanadeK@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Verify annotated tag and package version
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          uv run python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; actual = os.environ['GITHUB_REF_NAME']; expected = f'v{version}'; print(f'tag={actual} package={version}'); raise SystemExit(0 if actual == expected else f'Expected tag {expected}, got {actual}')"

      - name: Run the complete quality gate
        run: uv run python scripts/verify.py

      - name: Generate the synthetic demo
        run: uv run python scripts/demo.py

      - name: Build release assets
        run: uv run python scripts/package_release.py

      - name: Run the final release gate
        run: uv run python scripts/release_check.py

      - name: Verify release asset checksums
        working-directory: dist-release
        shell: bash
        run: sha256sum --check SHA256SUMS.txt

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist-release

      - name: Recheck downloaded asset checksums
        working-directory: dist-release
        shell: bash
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
