name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Run the complete quality gate
        run: uv run python scripts/verify.py

      - name: Build and clean-install release-shaped assets
        run: uv run python scripts/package_release.py

      - name: Upload Linux verification evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            coverage.xml
            docs/assets/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ci-package
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux static demo evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: static-demo
          path: site/
          if-no-files-found: error
          retention-days: 14
