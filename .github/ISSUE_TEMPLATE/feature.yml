name: Feature request
description: Suggest a focused improvement to WattWraith
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        WattWraith is offline-first and does not infer personal identity or
        sensitive behavior from power data. Please keep proposals within that
        privacy boundary.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need before describing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected input, output, and user-visible behavior.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection rules
        - Savings estimates
        - CSV or JSON import
        - Command-line interface
        - Streamlit application
        - Reports and exports
        - Documentation
        - Packaging or release
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Example or acceptance criteria
      description: Provide a synthetic example and explain how the result could be verified.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or smaller alternatives.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This proposal preserves WattWraith's offline-first privacy boundary.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
